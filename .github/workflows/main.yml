name: Doc Retype CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un seul run par branche : les PR annulent le run précédent,
# les déploiements sur main sont mis en file (jamais deux rsync --delete en parallèle)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - uses: retypeapp/action-build@v4
        with:
          override: '{"url": "https://doc.gestsis.ch"}'

      - name: Configure SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key

          # Clés du serveur vérifiées et stockées en secret (pas de ssh-keyscan : il ferait
          # confiance à n'importe quelle clé reçue au moment du déploiement)
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts

          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}

      - name: Deploy build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rsync -rtz --delete --timeout 30 -e ssh "$RETYPE_OUTPUT_PATH/" staging:doc.gestsis.ch
        continue-on-error: false
